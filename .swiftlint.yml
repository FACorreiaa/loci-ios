opt_in_rules:
  # correctable
  - closure_end_indentation
  - closure_spacing
  - comma_inheritance
  - explicit_init
  - implicit_return
  - joined_default_parameter
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - number_separator
  - operator_usage_whitespace
  - optional_enum_case_matching
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_type_annotation
  - self_binding
  - shorthand_optional_binding
  - sorted_imports
  - strong_iboutlet
  - test_case_accessibility
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

  # not-correctible, opt-in
  - array_init
  - closure_body_length
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discarded_notification_center_observer
  - discouraged_assert
  - discouraged_none_name
  - discouraged_object_literal
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - fallthrough
  - fatal_error_message
  - file_name
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - ibinspectable_in_extension
  - identical_operands
  - implicitly_unwrapped_optional
  - indentation_width
  - last_where
  - legacy_multiple
  - legacy_objc_type
  - let_var_whitespace
  - local_doc_comment
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - nslocalizedstring_key
  - nslocalizedstring_require_bundle
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - private_action
  - private_outlet
  - private_subject
  - prohibited_interface_builder
  - prohibited_super_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - raw_value_for_camel_cased_codable_enum
  - reduce_into
  - required_enum_case
  - return_value_from_void_function
  - single_test_class
  - sorted_first_last
  - static_operator
  - strict_fileprivate
  - unavailable_function
  - unowned_variable_capture
  - weak_delegate
  - xct_specific_matcher
  - yoda_condition

disabled_rules:
  - multiple_closures_with_trailing_closure
  - opening_brace
  # swift-format (lineBreakBeforeEachArgument) wraps closure params; this rule fights the formatter
  - closure_parameter_position
  - blanket_disable_command
  - todo
  - legacy_objc_type
  - discouraged_optional_boolean

analyzer_rules:
  - explicit_self
  - unused_import

trailing_comma:
  mandatory_comma: true

number_separator:
  minimum_length: 5

indentation_width:
  indentation_width: 2

closure_body_length:
  warning: 80
  error: 120

function_parameter_count:
  warning: 8
  error: 12

type_name:
  min_length:
    warning: 3
    error: 0
  max_length:
    warning: 50
    error: 1000
  excluded:
    - lociApp
    - lociTests
    - lociUITests
    - lociUITestsLaunchTests

file_name:
  excluded:
    - "PreviewHelpers.swift"
    - "Previews.swift"
    - "lociApp.swift"
    - "SecureStringStore.swift"

line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

function_body_length:
  warning: 90
  error: 120

type_body_length:
  warning: 500
  error: 700

file_length:
  warning: 900
  error: 1200
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 20
  error: 30

nesting:
  type_level: 2
  function_level: 5

identifier_name:
  min_length: 1
  max_length: 50
  excluded:
    - ws
    - id
    - me
    - a
    - b
    - i
    - j
    - k
    - x
    - y
    - z
    - vm
    - ui
    - api
    - url
    - db

force_unwrapping:
  severity: error

implicitly_unwrapped_optional:
  severity: warning

modifier_order:
  preferred_modifier_order:
    - acl
    - setterACL
    - override
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

excluded:
  - ".build"
  - "**/.build"
  - "build"
  - "**/build"
  - "DerivedData"
  - ".swiftpm"
  - "loci-connect-proto"
  - "**/loci-connect-proto"
  - "fastlane"
  - "**/fastlane"

reporter: "xcode"
