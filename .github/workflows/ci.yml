name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: macos-15

    defaults:
      run:
        working-directory: loci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout loci-connect-proto
        uses: actions/checkout@v4
        with:
          repository: FACorreiaa/loci-connect-proto
          path: loci-connect-proto

      - name: Setup local proto link
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../loci-connect-proto"
          cp -R "$GITHUB_WORKSPACE/loci-connect-proto/." "$GITHUB_WORKSPACE/../loci-connect-proto/"
          ls -la "$GITHUB_WORKSPACE/../loci-connect-proto"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-data-${{ hashFiles('loci/loci.xcodeproj/project.xcworkspace/contents.xcworkspacedata') }}
          restore-keys: |
            ${{ runner.os }}-derived-data-

      - name: Cache SwiftPM repositories
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Resolve Package Dependencies
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            xcodebuild -project loci.xcodeproj -scheme "loci Beta" -resolvePackageDependencies && break
            echo "Resolve attempt $i failed; retrying in 15s..."
            sleep 15
          done

      - name: Build (no tests) to surface Swift compile errors
        run: |
          xcodebuild build \
            -project loci.xcodeproj \
            -scheme "loci Beta" \
            -destination 'generic/platform=iOS Simulator' \
            -quiet

      - name: Resolve an iOS simulator
        id: sim
        run: |
          set -euo pipefail
          sim_name="$(xcrun simctl list devices available | grep -E 'iPhone 1[5-9]' | head -1 | sed -E 's/^[[:space:]]*([^(]+)[[:space:]]+\(.*/\1/' | xargs)"
          sim_name="${sim_name:-iPhone 16}"
          echo "Using simulator: $sim_name"
          echo "name=$sim_name" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$sim_name" || true

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project loci.xcodeproj \
            -scheme "loci Beta" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:lociTests \
            -quiet
