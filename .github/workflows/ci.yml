name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to the same PR makes the older run moot; main keeps every run.
concurrency:
  group: ios-ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint &> /dev/null; then
            curl -sSLo SwiftLint.pkg https://github.com/realm/SwiftLint/releases/download/0.65.1/SwiftLint.pkg
            sudo installer -pkg SwiftLint.pkg -target /
          fi
          swiftlint version

      - name: Check SwiftLint
        run: ./scripts/format.sh --skip-install --lint-only --reporter github-actions-logging

  test:
    name: Build and Test
    runs-on: macos-15
    timeout-minutes: 45

    defaults:
      run:
        working-directory: loci

    env:
      # One fixed DerivedData and SwiftPM checkout location for every step, so
      # the app is compiled exactly once (build-for-testing) and the test step
      # reuses it (test-without-building). Before, a plain build targeted the
      # generic simulator (~14.5 min) and `fastlane test` then recompiled
      # everything for the concrete device (~16 min incl. tests). Same fix as
      # norviq-ios #140. The `test` lane stays for local use.
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      SPM_DIR: ${{ github.workspace }}/build/SourcePackages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout loci-connect-proto
        uses: actions/checkout@v4
        with:
          repository: FACorreiaa/loci-connect-proto
          path: loci-connect-proto

      - name: Setup local proto link
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../loci-connect-proto"
          cp -R "$GITHUB_WORKSPACE/loci-connect-proto/." "$GITHUB_WORKSPACE/../loci-connect-proto/"
          ls -la "$GITHUB_WORKSPACE/../loci-connect-proto"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Only the SwiftPM checkouts are cached. DerivedData is deliberately not:
      # checkout gives every source a fresh mtime, so Xcode recompiles all of it
      # regardless, and restoring a multi-GB cache costs more than it saves
      # (measured on norviq-ios). The old DerivedData key hashed
      # contents.xcworkspacedata, which never changes, so it restored the same
      # stale snapshot on every run.
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('loci/loci.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Package Dependencies
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            xcodebuild -project loci.xcodeproj -scheme "loci Beta" \
              -clonedSourcePackagesDirPath "$SPM_DIR" \
              -resolvePackageDependencies && break
            echo "Resolve attempt $i failed; retrying in 15s..."
            sleep 15
          done

      # Ask xcodebuild, not simctl: it lists only simulators whose runtime meets
      # the deployment target. On some runs it sees only the "Any iOS Simulator"
      # placeholders, on the same image and Xcode as runs that find one: the
      # simulator service hadn't loaded its runtimes yet. So wake it, retry, and if
      # a new enough runtime exists with no iPhone on it, make one.
      - name: Resolve a simulator
        id: sim
        run: |
          set -euo pipefail
          pick() {
            xcodebuild -project loci.xcodeproj -scheme "loci Beta" -showdestinations \
              -clonedSourcePackagesDirPath "$SPM_DIR" 2>/dev/null \
              | grep -E 'platform:iOS Simulator, arch:arm64, id:[0-9A-F-]{36}, OS:[0-9.]+, name:iPhone' | tail -n 1 || true
          }
          line=""
          for attempt in 1 2 3 4; do
            xcrun simctl list runtimes >/dev/null 2>&1 || true
            line="$(pick)"
            [ -n "$line" ] && break
            echo "No iPhone simulator yet (attempt $attempt); waiting for the simulator service..."
            sleep 20
          done
          if [ -z "$line" ]; then
            target="$(xcodebuild -project loci.xcodeproj -scheme "loci Beta" -showBuildSettings 2>/dev/null \
              | awk '/ IPHONEOS_DEPLOYMENT_TARGET = / { print $3; exit }')"
            # The newest runtime that meets the target, and the newest iPhone it runs.
            read -r runtime device < <(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          target = tuple(int(p) for p in sys.argv[1].split("."))
          version = lambda r: tuple(int(p) for p in r["version"].split("."))
          ok = sorted((r for r in json.load(sys.stdin)["runtimes"]
                       if r.get("platform") == "iOS" and r.get("isAvailable") and version(r) >= target), key=version)
          phones = [d["identifier"] for d in (ok[-1].get("supportedDeviceTypes", []) if ok else [])
                    if d.get("productFamily") == "iPhone"]
          print(ok[-1]["identifier"], phones[-1]) if ok and phones else print("", "")
          ' "${target:-0}") || true
            if [ -n "${runtime:-}" ] && [ -n "${device:-}" ]; then
              echo "Creating an iPhone on $runtime ($device)"
              xcrun simctl create "CI iPhone" "$device" "$runtime" >/dev/null
              line="$(pick)"
            fi
          fi
          if [ -z "$line" ]; then
            echo "::error::No iPhone simulator meets the deployment target (${target:-unknown})."
            xcrun simctl list runtimes || true
            exit 1
          fi
          udid="$(grep -oE 'id:[0-9A-F-]{36}' <<<"$line" | cut -d: -f2)"
          echo "Using simulator: $(grep -oE 'name:[^}]+' <<<"$line" | cut -d: -f2) iOS $(grep -oE 'OS:[0-9.]+' <<<"$line" | cut -d: -f2) ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Compiles the app and lociTests once, for the simulator the tests run on.
      # A compile error fails here, before the test step.
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project loci.xcodeproj \
            -scheme "loci Beta" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - name: Run Unit Tests
        run: |
          xcodebuild test-without-building \
            -project loci.xcodeproj \
            -scheme "loci Beta" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -only-testing:lociTests \
            -resultBundlePath "$GITHUB_WORKSPACE/build/TestResults.xcresult" \
            -quiet

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # BRD-001: the mascot's motion data, fixtures and rig are copies of
  # loci-client design/. Needs the LOCI_CLIENT_READ_TOKEN secret (read access
  # to FACorreiaa/loci-client); fails loudly without it rather than skipping.
  mascot-motion-guard:
    name: Mascot motion drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require the loci-client read token
        env:
          TOKEN: ${{ secrets.LOCI_CLIENT_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::LOCI_CLIENT_READ_TOKEN is not set; the mascot drift guard cannot read loci-client design/."
            exit 1
          fi

      - name: Checkout loci-client design/
        uses: actions/checkout@v4
        with:
          repository: FACorreiaa/loci-client
          token: ${{ secrets.LOCI_CLIENT_READ_TOKEN }}
          path: loci-client
          sparse-checkout: design
          sparse-checkout-cone-mode: false

      - name: Compare copies
        run: scripts/mascot-motion-guard.sh loci-client/design

  # BRD-001: Release must carry no 3D mascot (file or Swift type); Beta must
  # carry all of it, so the check cannot pass vacuously.
  mascot-release-proof:
    name: Release has no 3D mascot
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mascot:
              - 'loci/loci/Core/Theme/**'
              - 'loci/loci/Resources/Mascot3D/**'
              - 'loci/lociTests/MascotMotionTests.swift'
              - 'loci/loci/Features/Auth/UI/LoginScreen.swift'
              - 'loci/loci.xcodeproj/project.pbxproj'
              - 'scripts/verify-release-no-mascot3d.sh'

      - name: Checkout repository
        if: steps.changes.outputs.mascot == 'true' || github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Checkout loci-connect-proto
        if: steps.changes.outputs.mascot == 'true' || github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          repository: FACorreiaa/loci-connect-proto
          path: loci-connect-proto

      - name: Setup local proto link
        if: steps.changes.outputs.mascot == 'true' || github.event_name == 'push'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../loci-connect-proto"
          cp -R "$GITHUB_WORKSPACE/loci-connect-proto/." "$GITHUB_WORKSPACE/../loci-connect-proto/"

      - name: Select Xcode
        if: steps.changes.outputs.mascot == 'true' || github.event_name == 'push'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify
        if: steps.changes.outputs.mascot == 'true' || github.event_name == 'push'
        run: scripts/verify-release-no-mascot3d.sh "$RUNNER_TEMP/DerivedData"
