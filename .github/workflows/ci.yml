name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint &> /dev/null; then
            curl -sSLo SwiftLint.pkg https://github.com/realm/SwiftLint/releases/download/0.65.1/SwiftLint.pkg
            sudo installer -pkg SwiftLint.pkg -target /
          fi
          swiftlint version

      - name: Check SwiftLint
        run: ./scripts/format.sh --skip-install --lint-only --reporter github-actions-logging

  test:
    name: Build and Test
    runs-on: macos-15
    timeout-minutes: 20

    defaults:
      run:
        working-directory: loci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout loci-connect-proto
        uses: actions/checkout@v4
        with:
          repository: FACorreiaa/loci-connect-proto
          path: loci-connect-proto

      - name: Setup local proto link
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../loci-connect-proto"
          cp -R "$GITHUB_WORKSPACE/loci-connect-proto/." "$GITHUB_WORKSPACE/../loci-connect-proto/"
          ls -la "$GITHUB_WORKSPACE/../loci-connect-proto"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: loci

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-data-${{ hashFiles('loci/loci.xcodeproj/project.xcworkspace/contents.xcworkspacedata') }}
          restore-keys: |
            ${{ runner.os }}-derived-data-

      - name: Cache SwiftPM repositories
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Resolve Package Dependencies
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            xcodebuild -project loci.xcodeproj -scheme "loci Beta" -resolvePackageDependencies && break
            echo "Resolve attempt $i failed; retrying in 15s..."
            sleep 15
          done

      - name: Build (no tests) to surface Swift compile errors
        run: |
          xcodebuild build \
            -project loci.xcodeproj \
            -scheme "loci Beta" \
            -destination 'generic/platform=iOS Simulator' \
            -quiet

      - name: Run Unit Tests
        run: bundle exec fastlane test
