# iOS release pipeline.
#   nightly (02:00 UTC)     -> TestFlight build of main (beta lane), only if main
#                              moved since the last upload and CI is green on it
#   manual dispatch (beta)  -> TestFlight build now
#   manual dispatch (release) -> App Store release (release lane)
#
# Not on every merge: App Store Connect caps uploads per app per day, and on
# 2026-09-25 parallel merges hit it ("409 Upload limit reached ... wait 1 day"),
# which left a crash fix off TestFlight for a day. The tag `testflight-latest`
# marks the last commit uploaded.

name: Release

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: Release lane
        required: true
        type: choice
        options: [beta, release]
        default: beta
      version:
        description: Marketing version (e.g. 1.0) - empty keeps current
        required: false
        type: string

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  nightly-gate:
    if: github.event_name == 'schedule'
    name: Anything new to ship?
    runs-on: ubuntu-latest
    outputs:
      ship: ${{ steps.check.outputs.ship }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          last=$(gh api "repos/$REPO/git/ref/tags/testflight-latest" --jq .object.sha 2>/dev/null || true)
          if [ "$last" = "$SHA" ]; then
            echo "main ($SHA) is already on TestFlight"
            echo "ship=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ci=$(gh api "repos/$REPO/commits/$SHA/check-runs" --jq '[.check_runs[] | select(.name == "Build and Test")][0].conclusion')
          if [ "$ci" != "success" ]; then
            echo "Build and Test on $SHA is '$ci', not success: skipping tonight"
            echo "ship=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "shipping $SHA (last upload: ${last:-none})"
          echo "ship=true" >> "$GITHUB_OUTPUT"

  beta:
    needs: nightly-gate
    if: >-
      always() && (
        (github.event_name == 'schedule' && needs.nightly-gate.outputs.ship == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.lane == 'beta')
      )
    name: TestFlight (beta)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: loci

    steps:
      - uses: actions/checkout@v4

      - name: Checkout loci-connect-proto
        uses: actions/checkout@v4
        with:
          repository: FACorreiaa/loci-connect-proto
          path: loci-connect-proto

      - name: Setup local proto link
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../loci-connect-proto"
          cp -R "$GITHUB_WORKSPACE/loci-connect-proto/." "$GITHUB_WORKSPACE/../loci-connect-proto/"
          ls -la "$GITHUB_WORKSPACE/../loci-connect-proto"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: loci

      - name: Fastlane beta
        run: bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      - name: Mark the uploaded commit
        run: |
          git tag -f testflight-latest "$GITHUB_SHA"
          git push -f origin refs/tags/testflight-latest

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'release'
    name: App Store (${{ inputs.lane }})
    runs-on: macos-15
    timeout-minutes: 90
    environment: app-store
    defaults:
      run:
        working-directory: loci

    steps:
      - uses: actions/checkout@v4

      - name: Checkout loci-connect-proto
        uses: actions/checkout@v4
        with:
          repository: FACorreiaa/loci-connect-proto
          path: loci-connect-proto

      - name: Setup local proto link
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../loci-connect-proto"
          cp -R "$GITHUB_WORKSPACE/loci-connect-proto/." "$GITHUB_WORKSPACE/../loci-connect-proto/"
          ls -la "$GITHUB_WORKSPACE/../loci-connect-proto"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: loci

      - name: Fastlane ${{ inputs.lane }}
        run: bundle exec fastlane ${{ inputs.lane }} ${{ inputs.version != '' && format('version:{0}', inputs.version) || '' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
