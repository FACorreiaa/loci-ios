# iOS release pipeline.
#   "iOS CI" green on main -> TestFlight build (beta lane)
#   manual dispatch        -> App Store release (release lane)

name: Release

on:
  workflow_run:
    workflows: ["iOS CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      lane:
        description: Release lane
        required: true
        type: choice
        options: [beta, release]
        default: beta
      version:
        description: Marketing version (e.g. 1.0) - empty keeps current
        required: false
        type: string

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  beta:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.lane == 'beta')
    name: TestFlight (beta)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: loci

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Checkout loci-connect-proto
        uses: actions/checkout@v4
        with:
          repository: FACorreiaa/loci-connect-proto
          path: loci-connect-proto

      - name: Setup local proto link
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../loci-connect-proto"
          cp -R "$GITHUB_WORKSPACE/loci-connect-proto/." "$GITHUB_WORKSPACE/../loci-connect-proto/"
          ls -la "$GITHUB_WORKSPACE/../loci-connect-proto"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: loci

      - name: Fastlane beta
        run: bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'release'
    name: App Store (${{ inputs.lane }})
    runs-on: macos-15
    timeout-minutes: 90
    environment: app-store
    defaults:
      run:
        working-directory: loci

    steps:
      - uses: actions/checkout@v4

      - name: Checkout loci-connect-proto
        uses: actions/checkout@v4
        with:
          repository: FACorreiaa/loci-connect-proto
          path: loci-connect-proto

      - name: Setup local proto link
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../loci-connect-proto"
          cp -R "$GITHUB_WORKSPACE/loci-connect-proto/." "$GITHUB_WORKSPACE/../loci-connect-proto/"
          ls -la "$GITHUB_WORKSPACE/../loci-connect-proto"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: loci

      - name: Fastlane ${{ inputs.lane }}
        run: bundle exec fastlane ${{ inputs.lane }} ${{ inputs.version != '' && format('version:{0}', inputs.version) || '' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
